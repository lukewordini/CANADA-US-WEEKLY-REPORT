<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly CAN/U.S. Media Reports</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e6eadf;
      color: #111;
    }

    header {
      background: #1f2a1f;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      background: #d3d8c8;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .tab {
      padding: 10px 18px;
      border: none;
      background: #ffffff;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }

    .tab.active {
      background: #1f2a1f;
      color: white;
    }

    .pdf-container {
      max-width: 1000px;
      height: 85vh;
      margin: 20px auto;
      padding: 0 15px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 2px solid #333;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Weekly CAN/U.S. Media Reports</h1>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showPDF('pdfs/June%2020.pdf', this)">June 20</button>
    <button class="tab" onclick="showPDF('pdfs/1%20June%20Report.pdf', this)">June 13</button>
  </div>

  <div class="pdf-container">
    <iframe id="pdfViewer" src="pdfs/June%2020.pdf"></iframe>
  </div>

  <script>
    function showPDF(pdfPath, clickedTab) {
      document.getElementById("pdfViewer").src = pdfPath;

      const tabs = document.querySelectorAll(".tab");
      tabs.forEach(tab => tab.classList.remove("active"));

      clickedTab.classList.add("active");
    }
  </script>
</body>
</html>
