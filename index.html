
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN-US Weekly Reports</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .tabs {
            display: flex;
            background-color: #003366;
        }

        .tab-btn {
            background: none;
            border: none;
            color: white;
            padding: 15px 25px;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-btn:hover {
            background-color: #0055aa;
        }

        .tab-btn.active {
            background-color: #0078d4;
        }

        #pdfViewer {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active"
            onclick="loadPDF('pdfs/1%20June%20Report.pdf', this)">
            June 1
        </button>

        <button class="tab-btn"
            onclick="loadPDF('pdfs/June%2020.pdf', this)">
            June 20
        </button>
    </div>

    pdfs/1%20June%20Report.pdf
    </iframe>

    <script>
        function loadPDF(pdfPath, button) {
            document.getElementById('pdfViewer').src = pdfPath;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            button.classList.add('active');
        }
    </script>

</body>
</html>
